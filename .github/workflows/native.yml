name: native

# Builds the gws release files for a release (NATIVE-DESIGN.md, section 4). Runs on master only, so the candidate manifest
# pins master's commit. It writes one gzip per platform and the candidate manifest/native.json the release commit copies,
# attests the gzips and uploads them as artifacts. It publishes nothing: the release job downloads this run's files,
# checks them against the pinned hashes and attaches them (scripts/attach-native.mjs).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native (gws)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Refuse anything but master
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::native builds run on master only, so the candidate pins master's commit."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no caches in release builds

      # Each executable is the pinned upstream release, checked against native/provenance.json before it is gzipped. The
      # tag is v<version> of package.json at this commit: the release tag the manifest's download URLs name.
      - name: Build the release files for every platform
        run: node scripts/build-native.mjs --release "$RUNNER_TEMP/native" --tag "v$(node -p 'require("./package.json").version')" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID"

      - name: Attest the executables
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/native/*.gz

      # The artifacts the release job reads: the candidate manifest as native.json, and the gzips of each platform.
      - name: Stage the artifacts
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/staged"
          mkdir -p "$staged/native-manifest"
          mv "$RUNNER_TEMP/native/native-manifest.json" "$staged/native-manifest/native.json"
          for target in darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu; do
            mkdir -p "$staged/native-$target"
            mv "$RUNNER_TEMP/native/gws-$target.gz" "$staged/native-$target/"
          done
          ls -R "$staged"

      - name: Upload the candidate manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-manifest
          path: ${{ runner.temp }}/staged/native-manifest
          retention-days: 30
          if-no-files-found: error

      - name: Upload the darwin-arm64 files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-darwin-arm64
          path: ${{ runner.temp }}/staged/native-darwin-arm64
          retention-days: 30
          if-no-files-found: error

      - name: Upload the darwin-x64 files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-darwin-x64
          path: ${{ runner.temp }}/staged/native-darwin-x64
          retention-days: 30
          if-no-files-found: error

      - name: Upload the linux-arm64-gnu files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-arm64-gnu
          path: ${{ runner.temp }}/staged/native-linux-arm64-gnu
          retention-days: 30
          if-no-files-found: error

      - name: Upload the linux-x64-gnu files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-x64-gnu
          path: ${{ runner.temp }}/staged/native-linux-x64-gnu
          retention-days: 30
          if-no-files-found: error
