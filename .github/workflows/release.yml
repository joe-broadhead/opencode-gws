name: Release

# A tag v<package.json version> on a master commit whose CI passed creates the GitHub Release. Releases are not
# published to npm: a consumer pins the tag, github:we-the-rebel-alliance/gws-plugin#v<version>, and the committed
# dist/ is what that tag installs, with no build. Only the owner decides a release; an agent never pushes a tag on its
# own.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Fetch the contract over HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: The tag names this package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "$TAG"
      - name: Pack the release files
        run: |
          set -euo pipefail
          mkdir -p release
          npx plugin-kit check --json > release/conformance.json
          npm pack --pack-destination release
          assets=(release/*.tgz release/conformance.json)
          if [ -f native/provenance.json ]; then cp native/provenance.json release/native-provenance.json; assets+=(release/native-provenance.json); fi
          if [ -f manifest/native.json ]; then cp manifest/native.json release/native.json; assets+=(release/native.json); fi
          sha256sum "${assets[@]}" > release/SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(release/*.tgz release/conformance.json release/SHA256SUMS)
          if [ -f release/native-provenance.json ]; then assets+=(release/native-provenance.json); fi
          if [ -f release/native.json ]; then assets+=(release/native.json); fi
          gh release create "$TAG" "${assets[@]}" --repo "$REPO" --verify-tag --title "$TAG" --generate-notes
