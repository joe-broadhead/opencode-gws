name: release

# A vX.Y.Z tag cut with `plugin-kit release` on master. Builds and checks the tagged commit, then publishes the GitHub
# release with dist/, SHA256SUMS, the conformance report and the native provenance. The lead cuts releases after merge.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build, check and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Stock OpenCode binary
        run: |
          platform="$(node -p 'process.platform')-$(node -p 'process.arch')"
          dir="$RUNNER_TEMP/stock-2.4.1"
          mkdir -p "$dir"
          (cd "$dir" && npm init -y >/dev/null && npm install "@opencode/cli@2.4.1" "@opencode/cli-$platform@2.4.1" --omit=optional --ignore-scripts --no-audit --no-fund)
          echo "OPENCODE_BIN_2_4_1=$dir/node_modules/@opencode/cli-$platform/bin/opencode" >> "$GITHUB_ENV"

      - name: Check the tagged commit
        run: npm run check

      - name: Keep the conformance report
        run: npx plugin-kit conformance --json > "$RUNNER_TEMP/conformance-report.json"

      - name: Package dist/ and write SHA256SUMS
        run: |
          tar -czf "$RUNNER_TEMP/dist.tar.gz" -C "$GITHUB_WORKSPACE" dist
          cp native/provenance.json "$RUNNER_TEMP/native-provenance.json"
          cd "$RUNNER_TEMP"
          sha256sum dist.tar.gz conformance-report.json native-provenance.json > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd "$RUNNER_TEMP"
          gh release create "$TAG" --verify-tag --generate-notes dist.tar.gz conformance-report.json native-provenance.json SHA256SUMS
