<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today</title>
<style>
  :root { color: var(--jelly-text, #222); background: var(--jelly-surface, #fff); font: 14px/1.45 var(--jelly-font, system-ui, sans-serif); }
  body { margin: 0; padding: 12px 14px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 10px; display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { border: 1px solid var(--jelly-border, #ddd); border-radius: var(--jelly-radius, 8px); background: var(--jelly-raised, transparent); padding: 8px 10px; }
  .when, .where, .note, .tag { color: var(--jelly-muted, #666); font-size: 12px; }
  .title { font-weight: 600; overflow-wrap: anywhere; }
  .where { overflow-wrap: anywhere; }
</style>
</head>
<body>
<main id="today" aria-live="polite"></main>
<script>
// jelly-view.js: a client of Jelly's view bridge. Paste it into the page's own <script>:
// a sealed page loads no script by URL and is given no global. Call jellyView() as the
// script starts; it resolves with the client when the app says hello.
function jellyView() {
  return new Promise((resolve) => {
    addEventListener("message", function hello(event) {
      const said = event.data;
      if (event.source !== parent || said?.v !== 1 || said.kind !== "hello" || !event.ports[0])
        return;
      removeEventListener("message", hello);
      const port = event.ports[0];
      const listeners = new Set();
      const latest = new Map();
      const queue = [];
      let sequence = 0;
      let current;
      const theme = (tokens) => {
        const style = document.documentElement.style;
        for (const [name, value] of Object.entries(tokens))
          if (name === "scheme") style.colorScheme = value;
          else style.setProperty(`--jelly-${name}`, value);
      };
      // The app answers one request at a time, so requests go in turn.
      const next = () => {
        if (current !== undefined || queue.length === 0) return;
        current = queue.shift();
        current.timer = setTimeout(
          () => settle({ ok: false, error: "No answer from the app" }),
          15000,
        );
        port.postMessage(current.message);
      };
      const settle = (answer) => {
        const done = current;
        current = undefined;
        clearTimeout(done.timer);
        if (answer.ok) done.resolve(answer.value);
        else done.reject(new Error(answer.error));
        next();
      };
      port.onmessage = ({ data }) => {
        if (data?.v !== 1) return;
        if (typeof data.kind !== "string") {
          if (current !== undefined && data.re === current.message.id) settle(data);
          return;
        }
        // A call waiting for the person is answered by `until`, not in 15 s.
        if (data.kind === "rpc.waiting" && data.re === current?.message.id) {
          clearTimeout(current.timer);
          current.timer = setTimeout(
            () => settle({ ok: false, error: "No answer from the app" }),
            Math.max(0, Date.parse(data.until) - Date.now()) + 15000,
          );
        }
        if (data.kind === "theme.changed") theme(data.theme);
        // A wait is news only while it lasts, so a later listener is not told of it.
        if (data.kind !== "rpc.waiting") latest.set(data.kind, data);
        for (const listener of listeners) listener(data);
      };
      port.start();
      theme(said.theme);
      const request = (op, fields = {}) =>
        new Promise((resolve, reject) => {
          queue.push({ resolve, reject, message: { ...fields, v: 1, id: String(++sequence), op } });
          next();
        });
      resolve({
        hello: said,
        // A listener first hears the latest push of each kind that came before it.
        on(listener) {
          for (const push of latest.values()) listener(push);
          listeners.add(listener);
          return () => listeners.delete(listener);
        },
        request,
        data: () => request("data.get"),
        state: () => request("state.get"),
        setState: (revision, data) => request("state.set", { revision, data }),
        call: (method, input = {}) => request("rpc.call", { method, input }),
        openAgent: (prefill) => request("open-agent", prefill === undefined ? {} : { prefill }),
        resize: (height) =>
          request("resize", { height: Math.min(1200, Math.max(1, Math.ceil(height))) }),
        decline: () => request("decline"),
      });
    });
  });
}

/** A reading older than this is shown as stale, as Jelly's own calendar does. */
const STALE_MS = 15 * 60 * 1000;

/**
 * calendar.today's answer as what the page draws: the account, whether it is stale, and the
 * entries not yet ended, all-day ones first, then by start. Null when the answer is missing or
 * malformed, which reads as "not available", never as an empty day.
 */
function agendaOf(answer, now) {
  if (!answer || typeof answer !== "object" || Array.isArray(answer)) return null;
  const at = Date.parse(answer.at);
  if (typeof answer.account !== "string" || answer.account === "" || !Number.isFinite(at)) return null;
  if (!["ready", "stale"].includes(answer.state) || !Array.isArray(answer.events) || answer.events.length > 50) return null;
  const rows = [];
  for (const event of answer.events) {
    if (!event || typeof event.title !== "string" || typeof event.id !== "string") continue;
    const start = Date.parse(event.start);
    const end = Date.parse(event.end);
    if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start || end <= now) continue;
    rows.push({
      title: event.title,
      allDay: event.allDay === true,
      start: event.start,
      end: event.end,
      location: typeof event.location === "string" ? event.location : "",
    });
  }
  rows.sort((a, b) => Number(b.allDay) - Number(a.allDay) || Date.parse(a.start) - Date.parse(b.start));
  return { account: answer.account, stale: answer.state === "stale" || now - at > STALE_MS, rows };
}

const clock = (value) => new Date(value).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function draw(root, agenda, message) {
  root.replaceChildren();
  const head = el("h1", "", "Today");
  if (agenda) head.append(el("span", "tag", agenda.stale ? `${agenda.account} \u00b7 not up to date` : agenda.account));
  root.append(head);
  if (!agenda) {
    root.append(el("p", "note", message || "Your calendar is not available right now."));
    return;
  }
  if (agenda.rows.length === 0) {
    root.append(el("p", "note", "Nothing else on your calendar today."));
    return;
  }
  const list = el("ol");
  for (const row of agenda.rows) {
    const item = el("li");
    item.append(el("div", "when", row.allDay ? "All day" : `${clock(row.start)} \u2013 ${clock(row.end)}`), el("div", "title", row.title));
    if (row.location) item.append(el("div", "where", row.location));
    list.append(item);
  }
  root.append(list);
}

if (typeof document !== "undefined" && document.getElementById("today")) {
  jellyView().then((view) => {
    const root = document.getElementById("today");
    view.on((push) => {
      if (push.kind === "rpc.waiting") draw(root, null, "Allow this in Jelly to see your calendar.");
    });
    const refresh = async () => {
      let agenda = null;
      try {
        agenda = agendaOf(await view.call("calendar.today", {}), Date.now());
      } catch {
        agenda = null;
      }
      draw(root, agenda);
      view.resize(document.documentElement.scrollHeight);
    };
    refresh();
    setInterval(refresh, 5 * 60 * 1000);
  });
}
</script>
</body>
</html>
